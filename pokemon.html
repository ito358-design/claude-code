<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      color: #f5c518;
      text-shadow: 0 0 12px rgba(245,197,24,0.5);
    }

    #card {
      background: #16213e;
      border-radius: 20px;
      padding: 32px 40px;
      width: 320px;
      min-height: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      position: relative;
    }

    #card:hover { transform: translateY(-4px); box-shadow: 0 14px 40px rgba(0,0,0,0.6); }
    #card:active { transform: scale(0.97); }

    #card.loading { opacity: 0.5; pointer-events: none; }

    #number {
      font-size: 0.85rem;
      color: #888;
      align-self: flex-start;
    }

    #sprite-wrap {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sprite {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      transition: opacity 0.3s ease;
    }

    #name {
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: capitalize;
      letter-spacing: 0.04em;
    }

    #types {
      display: flex;
      gap: 8px;
    }

    .type-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #info-row {
      display: flex;
      gap: 24px;
      font-size: 0.82rem;
      color: #aaa;
    }

    #stats {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .stat-name {
      width: 72px;
      text-align: right;
      color: #888;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }

    .stat-val {
      width: 28px;
      text-align: right;
      font-weight: 700;
    }

    .stat-bar-bg {
      flex: 1;
      height: 6px;
      background: #0f3460;
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    #hint {
      font-size: 0.78rem;
      color: #555;
      margin-top: 4px;
    }

    #spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #0f3460;
      border-top-color: #f5c518;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Type colors */
    .t-normal    { background: #9099a1; }
    .t-fire      { background: #ff9c54; color: #333; }
    .t-water     { background: #4d90d5; }
    .t-electric  { background: #f3d23b; color: #333; }
    .t-grass     { background: #63bb5b; }
    .t-ice       { background: #74cec0; }
    .t-fighting  { background: #ce4069; }
    .t-poison    { background: #ab6ac8; }
    .t-ground    { background: #d97746; }
    .t-flying    { background: #8fa8dd; }
    .t-psychic   { background: #f97176; }
    .t-bug       { background: #90c12c; color: #333; }
    .t-rock      { background: #c7b78b; color: #333; }
    .t-ghost     { background: #5269ac; }
    .t-dragon    { background: #0a6dc4; }
    .t-dark      { background: #5a5366; }
    .t-steel     { background: #5a8ea1; }
    .t-fairy     { background: #ec8fe6; color: #333; }
    .t-stellar   { background: #40b5a5; }
    .t-unknown   { background: #68a090; }
  </style>
</head>
<body>
  <h1>ランダムポケモン図鑑</h1>

  <div id="card" onclick="fetchRandom()">
    <div id="number"></div>
    <div id="sprite-wrap">
      <div id="spinner"></div>
      <img id="sprite" src="" alt="" style="display:none">
    </div>
    <div id="name">クリックしてはじめる</div>
    <div id="types"></div>
    <div id="info-row"></div>
    <div id="stats"></div>
    <div id="hint">クリックで次のポケモン</div>
  </div>

  <script>
    const TOTAL = 1025;

    const STAT_COLORS = {
      hp:              '#ff5959',
      attack:          '#f5ac78',
      defense:         '#fae078',
      'special-attack':'#9db7f5',
      'special-defense':'#a7db8d',
      speed:           '#fa92b2',
    };

    const STAT_JP = {
      hp:               'HP',
      attack:           'こうげき',
      defense:          'ぼうぎょ',
      'special-attack': 'とくこう',
      'special-defense':'とくぼう',
      speed:            'すばやさ',
    };

    async function fetchRandom() {
      const id = Math.floor(Math.random() * TOTAL) + 1;
      const card = document.getElementById('card');
      card.classList.add('loading');
      showSpinner(true);

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('name').textContent = 'エラー。再試行してください';
      } finally {
        card.classList.remove('loading');
        showSpinner(false);
      }
    }

    function showSpinner(on) {
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
      document.getElementById('sprite').style.display = on ? 'none' : 'block';
    }

    function render(p) {
      document.getElementById('number').textContent = `No.${String(p.id).padStart(4,'0')}`;
      document.getElementById('name').textContent = p.name;

      // sprite: prefer official artwork, fall back to front_default
      const artwork = p.sprites?.other?.['official-artwork']?.front_default;
      const img = document.getElementById('sprite');
      img.src = artwork || p.sprites?.front_default || '';
      img.alt = p.name;

      // types
      const typesEl = document.getElementById('types');
      typesEl.innerHTML = p.types
        .map(t => `<span class="type-badge t-${t.type.name}">${t.type.name}</span>`)
        .join('');

      // height / weight
      document.getElementById('info-row').innerHTML =
        `<span>高さ: ${(p.height / 10).toFixed(1)} m</span>` +
        `<span>重さ: ${(p.weight / 10).toFixed(1)} kg</span>`;

      // stats
      const statsEl = document.getElementById('stats');
      statsEl.innerHTML = p.stats.map(s => {
        const key = s.stat.name;
        const val = s.base_stat;
        const pct = Math.min(100, Math.round(val / 255 * 100));
        const color = STAT_COLORS[key] || '#aaa';
        const label = STAT_JP[key] || key;
        return `
          <div class="stat-row">
            <span class="stat-name">${label}</span>
            <span class="stat-val">${val}</span>
            <div class="stat-bar-bg">
              <div class="stat-bar" style="width:${pct}%;background:${color}"></div>
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
